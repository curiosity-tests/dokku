    name: unit.${{ matrix.index }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.build.outputs.matrix)}}

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: download packages
      uses: actions/download-artifact@v8
      with:
        name: build
        path: build

    - name: ci-setup
      run: ./.github/commands/ci-setup

      # - name: start ssh session
      #   uses: luchihoratiu/debug-via-ssh@main
      #   with:
      #     NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      #     SSH_PASS: ${{ secrets.NGROK_SSH_PASS }}

    - name: run ci
      timeout-minutes: 30
      run: sudo -E ./.github/commands/ci-run ${{ matrix.index }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        SYNC_GITHUB_PASSWORD: ${{ secrets.SYNC_GITHUB_PASSWORD }}
        SYNC_GITHUB_USERNAME: ${{ secrets.SYNC_GITHUB_USERNAME }}

    - uses: actions/upload-artifact@v7
